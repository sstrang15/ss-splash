<body>

    <main class="splash">

        <div class="splash-brand">
            stephenstrang.dev
        </div>

        <div class="splash-content">

            <section class="splash-status">
                <p id="status-command"></p>
                <p id="status-value"></p>
            </section>

            <section class="splash-message">
                <h1 id="splash-output"></h1>
                <span id="splash-text" class="message-type"></span><span class="typing-cursor message-type"></span>
            </section>

            <form class="splash-email" id="newsletter-form">
                <div class="email-row">
                    <span class="input-prompt"></span>

                    <input
                        type="email"
                        id="email-input"
                        name="email"
                        placeholder="email@example.com"
                        autocomplete="email"
                    >
                
                    <div id="newsletter-status"></div>
                </div>
            </form>

        </div>

        <nav class="splash-links" aria-label="External links">
            <a href="https://github.com/sstrang15">
                github
            </a>

            <a href="https://linkedin.com/in/stephenecon">
                linkedin
            </a>

            <a href="mailto:strangstep11@gmail.com">
                email
            </a>
